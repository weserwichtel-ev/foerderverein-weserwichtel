<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Background Circle -->
    <circle cx="50" cy="50" r="48" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
    
    <!-- Weser River Waves -->
    <path d="M 12 68 Q 30 58 50 68 T 88 68 C 88 84 75 94 50 94 C 25 94 12 84 12 68 Z" fill="url(#waveGrad)" opacity="0.35" />
    <path d="M 16 75 Q 33 66 50 75 T 84 75 C 84 86 73 94 50 94 C 27 94 16 86 16 75 Z" fill="url(#primaryGrad)" opacity="0.85" />
    
    <!-- Gnome / Wichtel Cap (Zipfelmütze) -->
    <path d="M 32 60 C 35 40 45 22 68 16 C 62 26 62 38 68 56 Z" fill="url(#warmGrad)" />
    <!-- Bobble / Star on top of cap -->
    <circle cx="69" cy="15" r="5" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
    
    <!-- Gnome Face / Nose & Beard -->
    <circle cx="48" cy="54" r="8" fill="#fed7aa" />
    <ellipse cx="50" cy="62" rx="14" ry="10" fill="#ffffff" />
    <circle cx="50" cy="57" r="4" fill="#fb923c" />
    
    <!-- Playful Star Sparkles -->
    <path d="M 76 34 L 78 39 L 83 41 L 78 43 L 76 48 L 74 43 L 69 41 L 74 39 Z" fill="#eab308" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 24)">
    <!-- Subtitle: FÖRDERVEREIN DER KITA -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#0284c7">
      FÖRDERVEREIN DER KITA
    </text>
    
    <!-- Main Title: WESERWICHTEL e.V. -->
    <text x="0" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
      Weserwichtel <tspan fill="#f97316">e.V.</tspan>
    </text>

    <!-- Tagline: Gemeinsam stark für unsere Kinder -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Gemeinsam stark für unsere Kinder • Berlin
    </text>
  </g>
</svg>
